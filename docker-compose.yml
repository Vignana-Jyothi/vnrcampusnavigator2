services:
  ## ── Backend (FastAPI) ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusnav_backend
    restart: unless-stopped
    environment:
      MONGODB_URI: ${MONGODB_URI}
      DB_NAME: ${DB_NAME}
      SECRET_KEY: ${SECRET_KEY}
    ports:
      - "6316:8000"
    networks:
      - campusnav_net

  ## ── Frontend (React + Vite) ───────────────────────────────────────────────────-
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: campusnav_frontend
    restart: unless-stopped
    ports:
      - "3326:3000"
    depends_on:
      - backend
    networks:
      - campusnav_net

networks:
  campusnav_net:
    driver: bridge