name: Navigation CI

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

jobs:
  backend:
    runs-on: gamma

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - run: python3 --version

      - run: python3 -m pip install -r requirements.txt --break-system-packages

  frontend:
    runs-on: gamma

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - run: npm run build

      - run: npm run lint