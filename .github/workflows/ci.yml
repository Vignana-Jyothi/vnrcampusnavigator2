name: CI/CD — Campus Navigator

on:
  push:
    branches: [main, master, develop, dev]
  pull_request:
    branches: [main, master, develop, dev]

env:
  PATH: /opt/jmeter/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin

jobs:
  # ────────────────────────────────────────────────────────────────
  # JOB 1 — Backend Check
  # ────────────────────────────────────────────────────────────────
  backend-check:
    name: Backend Python Check
    runs-on: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && 'gamma' || 'dev-ai' }}
    environment:
      name: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && 'navi-production' || 'navi-development' }}

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  # ────────────────────────────────────────────────────────────────
  # JOB 2 — Frontend
  # ────────────────────────────────────────────────────────────────
  frontend-lint-build:
    name: Frontend Lint & Build
    runs-on: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && 'gamma' || 'dev-ai' }}
    environment:
      name: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && 'navi-production' || 'navi-development' }}
    needs: backend-check

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

  # ────────────────────────────────────────────────────────────────
  # JOB 3 — Deploy
  # ────────────────────────────────────────────────────────────────
  deploy:
    name: Build & Deploy Docker Containers
    runs-on: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && 'gamma' || 'dev-ai' }}
    environment:
      name: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && 'navi-production' || 'navi-development' }}
    needs:
      - backend-check
      - frontend-lint-build

    if: |
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master' ||
       github.ref == 'refs/heads/dev') &&
      github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Docker
        run: |
          docker --version
          docker compose version

      - name: Create .env
        run: |
          cat <<EOF > .env
          MONGODB_URI=${{ secrets.MONGODB_URI }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          VITE_API_URL=${{ secrets.VITE_API_URL }}
          EOF

      - name: Stop old containers
        run: |
          docker compose down --remove-orphans || true
          docker image prune -f

      - name: Build Docker Images
        run: |
          docker compose build \
            --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }}

      - name: Start Containers
        run: |
          docker compose up -d

      - name: Show Running Containers
        run: docker compose ps

      - name: Cleanup Images
        run: docker image prune -f
        continue-on-error: true