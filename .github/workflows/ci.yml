name: CI/CD — Campus Navigator

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

env:
  PATH: /opt/jmeter/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin

jobs:
  # ────────────────────────────────────────────────────────────────
  # JOB 1 — Backend (FastAPI) Check
  # ────────────────────────────────────────────────────────────────
  backend-check:
    name: Backend Python Check
    runs-on: gamma

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Check Python version
        run: python3 --version

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip --break-system-packages
          pip3 install -r requirements.txt --break-system-packages

  # ────────────────────────────────────────────────────────────────
  # JOB 2 — Frontend Lint & Build
  # ────────────────────────────────────────────────────────────────
  frontend-lint-build:
    name: Frontend Lint & Build
    runs-on: gamma
    needs: backend-check

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node.js 20
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint
        continue-on-error: true

  # ────────────────────────────────────────────────────────────────
  # JOB 3 — Docker Build & Deploy
  # ────────────────────────────────────────────────────────────────
  deploy:
    name: Build & Deploy Docker Containers
    runs-on: gamma
    needs: [backend-check, frontend-lint-build]
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Verify Docker is accessible
        run: docker --version && docker compose version

      - name: Set deploy variables
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ] || [ "${{ github.ref }}" == "refs/heads/master" ]; then
            echo "COMPOSE_FILE=docker-compose.yml" >> $GITHUB_ENV
            echo "VITE_API_URL=https://navi.vjstartup.com/api" >> $GITHUB_ENV
          else
            echo "COMPOSE_FILE=docker-compose.dev.yml" >> $GITHUB_ENV
            echo "VITE_API_URL=https://navigation.vjstartup.com/api" >> $GITHUB_ENV
          fi

      - name: Create .env file
        run: |
          cat << EOF > .env
          MONGO_URI=${{ secrets.MONGO_URI }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          VITE_API_URL=${{ env.VITE_API_URL }}
          EOF

      - name: Force remove old containers
        run: |
          docker compose -f $COMPOSE_FILE down --remove-orphans 2>/dev/null || true
          docker image prune -f

      - name: Build Docker images
        run: |
          docker compose -f $COMPOSE_FILE build \
            --build-arg VITE_API_URL=${{ env.VITE_API_URL }}

      - name: Start containers
        run: docker compose -f $COMPOSE_FILE up -d

      - name: Show running containers
        run: docker compose -f $COMPOSE_FILE ps

      - name: Clean up old images
        run: docker image prune -f
        continue-on-error: true